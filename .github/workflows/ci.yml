name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show the Python runtime
        run: python --version

      - name: Verify Python syntax
        run: >-
          python -m compileall -q
          projects/01-data-foundation/src
          projects/01-data-foundation/scripts
          projects/01-data-foundation/tests

      - name: Validate JSON contracts and synthetic examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json_files = sorted(Path("shared").rglob("*.json"))
          json_files += sorted(Path("projects").rglob("*.json"))
          if not json_files:
              raise SystemExit("No JSON contracts or examples were found.")

          for path in json_files:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)

          print(f"Validated {len(json_files)} JSON files.")
          PY

      - name: Run all Python tests
        run: python -m unittest discover -s projects/01-data-foundation/tests -v

      - name: Run architecture validation
        run: python projects/01-data-foundation/scripts/validate_architecture.py

      - name: Run the synthetic Globex demonstration
        run: python projects/01-data-foundation/scripts/demo_source_model.py

      - name: Run the synthetic Globex field-authority demonstration
        run: python projects/01-data-foundation/scripts/demo_field_authority.py

      - name: Run the synthetic GTM data demonstration
        run: python projects/01-data-foundation/scripts/demo_synthetic_data.py

      - name: Run the mocked live-ingestion demonstration
        run: python projects/01-data-foundation/scripts/demo_live_ingestion.py

      - name: Generate and validate a small synthetic dataset
        run: >-
          python projects/01-data-foundation/scripts/generate_synthetic_gtm_data.py
          --companies 25
          --seed 42
          --output "${RUNNER_TEMP}/sai-revenueos-p15"
